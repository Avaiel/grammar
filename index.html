<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语句子结构拆解 · Sentence Diagram</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23f7f4ec'/%3E%3Cpath d='M14 46 L40 20 L46 26 L20 52 Z' fill='%232f4a6b'/%3E%3Cpath d='M40 20 L46 14 L52 20 L46 26 Z' fill='%23b8451f'/%3E%3Cpath d='M14 46 L20 52 L13 55 Z' fill='%232b2620'/%3E%3C/svg%3E">
<!-- Sentence Diagram — English structure & part-of-speech breakdown tool -->
<style>
  :root {
    --paper: #f7f4ec;
    --paper-line: #e3ddc9;
    --ink: #2b2620;
    --ink-soft: #6b6459;
    --ink-blue: #2f4a6b;
    --ink-blue-soft: #5b7595;
    --red-pen: #b8451f;
    --border: #d9d2b8;

    --pos-noun: #a6791f;
    --pos-verb: #b8451f;
    --pos-adj: #2f6f5a;
    --pos-adv: #6b4e9e;
    --pos-pron: #a3556a;
    --pos-prep: #3d6ea5;
    --pos-conj: #6b6459;
    --pos-det: #8a8060;
    --pos-other: #9a9483;

    --font-display: 'Source Serif Pro', Georgia, 'Songti SC', serif;
    --font-body: 'Inter', -apple-system, 'PingFang SC', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', monospace;
  }

  * { box-sizing: border-box; }

  body, .sp-root {
    margin: 0;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-body);
  }

  .sp-root {
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 32px;
    background-color: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 36px 40px 44px;
    max-width: 860px;
    margin: 0 auto;
  }

  .sp-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-blue-soft);
    margin-bottom: 6px;
  }

  .sp-title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .sp-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 26px;
  }

  .sp-input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .sp-action-row {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .sp-lang-select {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 0 10px;
    height: 38px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: #fffdf8;
    color: var(--ink);
  }
  .sp-lang-arrow {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-soft);
  }

  .sp-btn-alt {
    background: var(--red-pen);
  }
  .sp-btn-alt:hover { background: #93381a; }
  .sp-btn-alt:disabled { background: #a9a293; }

  .sp-translate-card {
    background: #fffdf8;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px 22px;
    margin-bottom: 26px;
  }
  .sp-translate-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-blue-soft);
    margin-bottom: 10px;
    letter-spacing: 0.04em;
  }
  .sp-translate-text {
    font-family: var(--font-display);
    font-size: 19px;
    line-height: 1.7;
    color: var(--ink);
  }

  .sp-input {
    flex: 1;
    font-family: var(--font-display);
    font-size: 17px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: #fffdf8;
    color: var(--ink);
  }
  .sp-input:focus {
    outline: none;
    border-color: var(--ink-blue-soft);
    box-shadow: 0 0 0 3px rgba(47,74,107,0.08);
  }

  .sp-btn {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--ink-blue);
    color: #fdfbf4;
    border: none;
    border-radius: 3px;
    padding: 0 20px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .sp-btn:hover { background: #24374e; }
  .sp-btn:disabled { background: #a9a293; cursor: default; }

  .sp-examples {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 30px;
  }
  .sp-example {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-blue-soft);
    border: 1px solid var(--paper-line);
    background: #fffdf8;
    border-radius: 12px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .sp-example:hover { border-color: var(--ink-blue-soft); color: var(--ink-blue); }

  .sp-status {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    margin: 10px 0 20px;
    min-height: 16px;
  }

  .sp-error {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--red-pen);
    margin: 10px 0 20px;
  }

  /* --- sentence render --- */
  .sp-sentence-card {
    background: #fffdf8;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px 26px 22px;
    margin-bottom: 26px;
  }

  .sp-sentence {
    font-family: var(--font-display);
    font-size: 22px;
    line-height: 2.1;
    margin-bottom: 6px;
  }

  .sp-word {
    cursor: pointer;
    border-bottom: 2px solid transparent;
    padding: 1px 1px;
    transition: background 0.1s ease;
    position: relative;
  }
  .sp-word:hover { background: rgba(47,74,107,0.06); }
  .sp-word.active { background: rgba(47,74,107,0.1); }

  .sp-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--paper-line);
  }
  .sp-legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-soft);
  }
  .sp-legend-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  /* --- word detail panel --- */
  .sp-detail {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--paper-line);
    min-height: 44px;
  }
  .sp-detail-empty {
    font-size: 12.5px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .sp-detail-word {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .sp-detail-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
  }

  .sp-dict-section {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--paper-line);
  }
  .sp-dict-source {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .sp-dict-source.sub {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px dotted var(--paper-line);
  }
  .sp-dict-pinyin {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--pos-verb);
    margin-bottom: 6px;
  }
  .sp-dict-phonetic {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--ink-blue-soft);
    margin-bottom: 8px;
  }
  .sp-dict-pos {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-blue);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 10px 0 4px;
  }
  .sp-dict-def {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink);
    margin-bottom: 4px;
    padding-left: 14px;
    position: relative;
  }
  .sp-dict-def::before {
    content: '·';
    position: absolute;
    left: 2px;
    color: var(--ink-soft);
  }
  .sp-dict-example {
    font-size: 12.5px;
    font-style: italic;
    color: var(--ink-soft);
    margin: 2px 0 6px 14px;
  }
  .sp-dict-loading, .sp-dict-empty {
    font-size: 12.5px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .sp-web-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--red-pen);
    background: none;
    border: 1px solid var(--red-pen);
    border-radius: 12px;
    padding: 4px 11px;
    margin-top: 10px;
    cursor: pointer;
  }
  .sp-web-btn:hover { background: rgba(184,69,31,0.08); }
  .sp-web-btn:disabled { opacity: 0.5; cursor: default; }
  .sp-web-note {
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
    margin-top: 8px;
    padding: 8px 10px;
    background: #f7f2e4;
    border-radius: 3px;
  }

  /* --- structure section --- */
  .sp-section-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-blue-soft);
    margin-bottom: 10px;
  }

  .sp-formula {
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--ink-blue);
    background: #eef2ea;
    display: inline-block;
    padding: 6px 12px;
    border-radius: 3px;
    margin-bottom: 20px;
    letter-spacing: 0.02em;
  }

  .sp-clauses {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
  }
  .sp-clause {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 14px;
    align-items: start;
    padding: 10px 0;
    border-bottom: 1px solid var(--paper-line);
  }
  .sp-clause:last-child { border-bottom: none; }
  .sp-clause-tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: #fff;
    background: var(--ink-blue);
    border-radius: 3px;
    padding: 3px 6px;
    text-align: center;
    height: fit-content;
    white-space: nowrap;
  }
  .sp-clause-tag.sub { background: var(--red-pen); }
  .sp-clause-text {
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 3px;
  }
  .sp-clause-note {
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .sp-summary {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink);
    background: #fffdf8;
    border-left: 3px solid var(--red-pen);
    padding: 12px 16px;
    border-radius: 0 3px 3px 0;
  }

  .sp-footer-note {
    margin-top: 24px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-soft);
    opacity: 0.75;
  }

  .sp-key-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 18px;
    padding: 10px 12px;
    background: #fbf5e6;
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .sp-key-row label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .sp-key-input {
    flex: 1;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: #fffdf8;
    color: var(--ink);
  }
  .sp-key-hint {
    font-size: 10.5px;
    color: var(--ink-soft);
  }

  @media (max-width: 560px) {
    .sp-root { padding: 24px 18px 32px; }
    .sp-sentence { font-size: 18px; line-height: 2; }
    .sp-clause { grid-template-columns: 70px 1fr; }
  }
</style>
</head>
<body>

<div class="sp-root">
  <div class="sp-eyebrow">Sentence Diagram</div>
  <h1 class="sp-title">英语句子结构拆解</h1>
  <div class="sp-sub">输入一句英文，逐词标注词性，并拆出句子主干与从句结构</div>

  <div class="sp-key-row" id="sp-key-row">
    <label for="sp-key">Gemini Key</label>
    <input class="sp-key-input" id="sp-key" type="password" placeholder="粘贴你的 Gemini API Key（只保存在本次浏览，不会上传/存储）" />
    <span class="sp-key-hint">在 Google AI Studio 免费获取</span>
  </div>

  <div class="sp-key-row" id="sp-mw-key-row">
    <label for="sp-mw-key">M-W Key</label>
    <input class="sp-key-input" id="sp-mw-key" type="password" placeholder="可选：粘贴 Merriam-Webster API Key，解锁更权威的英英释义" />
    <span class="sp-key-hint">在 dictionaryapi.com 免费获取</span>
  </div>

  <div class="sp-input-row">
    <input class="sp-input" id="sp-input" type="text"
      placeholder="e.g. Although she was tired, she finished the translation before the deadline." />
  </div>

  <div class="sp-action-row">
    <button class="sp-btn" id="sp-btn">解析结构 Analyze</button>
    <span class="sp-lang-arrow">译成 →</span>
    <select class="sp-lang-select" id="sp-target-lang"></select>
    <button class="sp-btn sp-btn-alt" id="sp-translate-btn">翻译 Translate</button>
  </div>

  <div class="sp-examples" id="sp-examples"></div>
  <div class="sp-status" id="sp-status"></div>
  <div class="sp-error" id="sp-error"></div>

  <div id="sp-translate-result"></div>
  <div id="sp-result"></div>

  <div class="sp-footer-note">词性标注按语境判断，同一词在不同句子中可能标注不同 · 点击句中单词查看解释 · 翻译会自动识别输入语言</div>
</div>

<script>
(function () {
  const posMeta = {
    noun:  { zh: '名词',  color: 'var(--pos-noun)' },
    verb:  { zh: '动词',  color: 'var(--pos-verb)' },
    adj:   { zh: '形容词', color: 'var(--pos-adj)' },
    adv:   { zh: '副词',  color: 'var(--pos-adv)' },
    pron:  { zh: '代词',  color: 'var(--pos-pron)' },
    prep:  { zh: '介词',  color: 'var(--pos-prep)' },
    conj:  { zh: '连词',  color: 'var(--pos-conj)' },
    det:   { zh: '限定词', color: 'var(--pos-det)' },
    other: { zh: '其他',  color: 'var(--pos-other)' }
  };

  const examples = [
    "Although she was tired, she finished the translation before the deadline.",
    "The novel that we localized last month sold surprisingly well overseas.",
    "Whoever finishes the review first gets to pick the next project."
  ];

  // 部署到 GitHub 前，也可以直接把 key 写死在这里（写死后上面的输入框会自动隐藏）：
  const GEMINI_API_KEY_HARDCODED = '';

  const $input = document.getElementById('sp-input');
  const $btn = document.getElementById('sp-btn');
  const $status = document.getElementById('sp-status');
  const $error = document.getElementById('sp-error');
  const $result = document.getElementById('sp-result');
  const $examples = document.getElementById('sp-examples');
  const $keyRow = document.getElementById('sp-key-row');
  const $key = document.getElementById('sp-key');
  const $mwKey = document.getElementById('sp-mw-key');

  try {
    const savedMw = localStorage.getItem('sp_mw_key');
    if (savedMw) $mwKey.value = savedMw;
  } catch (e) { /* 预览环境不支持本地存储，忽略即可 */ }
  $mwKey.addEventListener('change', () => {
    try { localStorage.setItem('sp_mw_key', $mwKey.value.trim()); } catch (e) { /* 忽略 */ }
  });

  if (GEMINI_API_KEY_HARDCODED) {
    $keyRow.style.display = 'none';
  } else {
    // 尝试从本地存储读回上次填过的 key（部署到实际网页后才生效，
    // 在 Claude 内的预览环境里 localStorage 可能被禁用，会被下面的 try/catch 安静地忽略）
    try {
      const saved = localStorage.getItem('sp_gemini_key');
      if (saved) $key.value = saved;
    } catch (e) { /* 预览环境不支持本地存储，忽略即可 */ }

    $key.addEventListener('change', () => {
      try { localStorage.setItem('sp_gemini_key', $key.value.trim()); } catch (e) { /* 忽略 */ }
    });
  }

  const RESPONSE_SCHEMA = {
    type: 'OBJECT',
    properties: {
      w: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: {
            t: { type: 'STRING' },
            p: { type: 'STRING', enum: ['noun','verb','adj','adv','pron','prep','conj','det','other'] },
            e: { type: 'STRING' }
          },
          required: ['t','p','e']
        }
      },
      f: { type: 'STRING' },
      c: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
          properties: {
            tag: { type: 'STRING' },
            sub: { type: 'BOOLEAN' },
            s: { type: 'INTEGER' },
            en: { type: 'INTEGER' },
            n: { type: 'STRING' }
          },
          required: ['tag','sub','s','en','n']
        }
      },
      sum: { type: 'STRING' }
    },
    required: ['w','f','c','sum']
  };

  examples.forEach(ex => {
    const el = document.createElement('div');
    el.className = 'sp-example';
    el.textContent = ex.length > 46 ? ex.slice(0, 46) + '…' : ex;
    el.title = ex;
    el.onclick = () => { $input.value = ex; analyze(); };
    $examples.appendChild(el);
  });

  const LANGUAGES = [
    { code: 'zh', name: '中文' },
    { code: 'en', name: 'English' },
    { code: 'ja', name: '日本語' },
    { code: 'ko', name: '한국어' },
    { code: 'fr', name: 'Français' },
    { code: 'de', name: 'Deutsch' },
    { code: 'es', name: 'Español' },
    { code: 'ru', name: 'Русский' },
    { code: 'pt', name: 'Português' },
    { code: 'vi', name: 'Tiếng Việt' },
    { code: 'th', name: 'ไทย' },
    { code: 'ar', name: 'العربية' }
  ];
  const $targetLang = document.getElementById('sp-target-lang');
  const $translateBtn = document.getElementById('sp-translate-btn');
  const $translateResult = document.getElementById('sp-translate-result');
  LANGUAGES.forEach(l => $targetLang.add(new Option(l.name, l.code)));
  try {
    const savedLang = localStorage.getItem('sp_target_lang');
    if (savedLang && LANGUAGES.some(l => l.code === savedLang)) $targetLang.value = savedLang;
    else $targetLang.value = 'zh';
  } catch (e) { $targetLang.value = 'zh'; }
  $targetLang.addEventListener('change', () => {
    try { localStorage.setItem('sp_target_lang', $targetLang.value); } catch (e) { /* 忽略 */ }
  });

  const TRANSLATE_SCHEMA = {
    type: 'OBJECT',
    properties: {
      detected: { type: 'STRING' },
      translation: { type: 'STRING' }
    },
    required: ['detected', 'translation']
  };

  $translateBtn.onclick = translate;

  async function translate() {
    const sentence = $input.value.trim();
    if (!sentence) return;

    const apiKey = GEMINI_API_KEY_HARDCODED || $key.value.trim();
    if (!apiKey) {
      $error.textContent = '先粘贴一个 Gemini API Key（去 Google AI Studio 免费领一个）';
      return;
    }

    const targetName = (LANGUAGES.find(l => l.code === $targetLang.value) || LANGUAGES[0]).name;

    $error.textContent = '';
    $translateResult.innerHTML = '';
    $status.textContent = '翻译中 · translating…';
    $translateBtn.disabled = true;

    const systemPrompt =
      'You are a precise translator. Detect the source language of the given text automatically, ' +
      `then translate it into ${targetName}. ` +
      'detected = the name of the detected source language, written in Chinese (e.g. "英语", "日语", "法语"). ' +
      'translation = a natural, accurate translation into the target language, preserving tone and meaning. ' +
      'If the text is already in the target language, still fill detected with its actual language and translation with a lightly polished version of the same text.';

    let rawText = '';
    try {
      const response = await fetch(
        'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=' + encodeURIComponent(apiKey),
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [ { role: 'user', parts: [ { text: sentence } ] } ],
            systemInstruction: { parts: [ { text: systemPrompt } ] },
            generationConfig: {
              maxOutputTokens: 2000,
              responseMimeType: 'application/json',
              responseSchema: TRANSLATE_SCHEMA,
              thinkingConfig: { thinkingLevel: 'low' }
            }
          })
        }
      );

      const data = await response.json();
      if (data.error) throw new Error(data.error.message || 'API error');

      const candidate = data.candidates && data.candidates[0];
      const parts = (candidate && candidate.content && candidate.content.parts) || [];
      rawText = parts.map(p => p.text || '').join('');
      if (!rawText) {
        if (candidate && candidate.finishReason === 'MAX_TOKENS') {
          throw new Error('句子太长，被截断了，试试拆短一点');
        }
        throw new Error('empty response');
      }

      const parsed = parseModelJson(rawText);
      renderTranslation(parsed, targetName);
      $status.textContent = '';
    } catch (err) {
      console.error('translate failed:', err, '\nraw model output:\n', rawText);
      $error.textContent = '翻译失败：' + (err.message || '请重试一次');
      $status.textContent = '';
    } finally {
      $translateBtn.disabled = false;
    }
  }

  function renderTranslation(data, targetName) {
    let html = '<div class="sp-translate-card">';
    html += `<div class="sp-translate-meta">检测到 ${escapeHtml(data.detected || '')} · 译为 ${escapeHtml(targetName)}</div>`;
    html += `<div class="sp-translate-text">${escapeHtml(data.translation || '')}</div>`;
    html += '</div>';
    $translateResult.innerHTML = html;
  }

  $btn.onclick = analyze;
  $input.addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });

  async function analyze() {
    const sentence = $input.value.trim();
    if (!sentence) return;

    const apiKey = GEMINI_API_KEY_HARDCODED || $key.value.trim();
    if (!apiKey) {
      $error.textContent = '先粘贴一个 Gemini API Key（去 Google AI Studio 免费领一个）';
      return;
    }

    $error.textContent = '';
    $result.innerHTML = '';
    $status.textContent = '解析中 · analyzing…';
    $btn.disabled = true;

    const systemPrompt =
      'You are a precise English grammar analyzer for a Chinese-English translator. ' +
      'Given one English sentence, analyze it into the required JSON schema. ' +
      'w = every token in order (including punctuation, pos "other", e "标点"); t = exact token text; e = short Chinese note (<=10 chars) on this word\'s grammatical role in THIS sentence. ' +
      'f = short structure formula, e.g. "状语从句 + 主句(主谓宾)". ' +
      'c = clause list; s/en = start/end index (inclusive, into the w array) of that clause\'s words; tag = short Chinese label like "主句" or "状语从句"; n = one short Chinese sentence (<=40 chars) on that clause\'s function. ' +
      'sum = 1-2 short Chinese sentences (<=60 chars each) summarizing the structure, aimed at someone doing Chinese-English translation work. Keep every string short and specific to this sentence.';

    let rawText = '';
    try {
      const response = await fetch(
        'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=' + encodeURIComponent(apiKey),
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [ { role: 'user', parts: [ { text: sentence } ] } ],
            systemInstruction: { parts: [ { text: systemPrompt } ] },
            generationConfig: {
              maxOutputTokens: 4000,
              responseMimeType: 'application/json',
              responseSchema: RESPONSE_SCHEMA,
              thinkingConfig: { thinkingLevel: 'low' }
            }
          })
        }
      );

      const data = await response.json();
      if (data.error) throw new Error(data.error.message || 'API error');

      const candidate = data.candidates && data.candidates[0];
      const parts = (candidate && candidate.content && candidate.content.parts) || [];
      rawText = parts.map(p => p.text || '').join('');
      if (!rawText) {
        if (candidate && candidate.finishReason === 'MAX_TOKENS') {
          throw new Error('句子太长，模型没写完就被截断了，试试拆短一点');
        }
        throw new Error('empty response');
      }

      const parsed = parseModelJson(rawText);
      render(parsed);
      $status.textContent = '';
    } catch (err) {
      console.error('analyze failed:', err, '\nraw model output:\n', rawText);
      let msg = err.message || '请重试一次';
      if (/JSON/i.test(msg) || /Unterminated|Unexpected/i.test(msg)) {
        msg = '句子偏长，模型输出没写完就断了——试试把句子拆短一点，或再点一次解析';
      }
      $error.textContent = '解析失败：' + msg;
      $status.textContent = '';
    } finally {
      $btn.disabled = false;
    }
  }

  function parseModelJson(text) {
    let clean = text.trim()
      .replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '')
      .trim();
    try {
      return JSON.parse(clean);
    } catch (e) {
      // fallback: the response may have been cut off mid-object (max_tokens limit)
      // or have trailing junk. Try trimming to the last plausible closing point.
      const lastBrace = clean.lastIndexOf('}');
      if (lastBrace > -1) {
        let attempt = clean.slice(0, lastBrace + 1);
        // balance closing brackets/braces if truncated mid-array
        try { return JSON.parse(attempt); } catch (e2) { /* fall through */ }
      }
      throw e;
    }
  }

  function render(data) {
    const words = data.w || [];
    const clauses = data.c || [];

    // legend of pos types actually present
    const usedPos = [...new Set(words.map(w => w.p))].filter(p => posMeta[p]);

    let html = '';

    // sentence card
    html += '<div class="sp-sentence-card">';
    html += '<div class="sp-sentence" id="sp-sentence">';
    words.forEach((w, i) => {
      const meta = posMeta[w.p] || posMeta.other;
      html += `<span class="sp-word" data-i="${i}" style="color:${meta.color}">${escapeHtml(w.t)}</span> `;
    });
    html += '</div>';

    html += '<div class="sp-legend">';
    usedPos.forEach(p => {
      html += `<div class="sp-legend-item"><span class="sp-legend-dot" style="background:${posMeta[p].color}"></span>${posMeta[p].zh}</div>`;
    });
    html += '</div>';

    html += '<div class="sp-detail" id="sp-detail"><div class="sp-detail-empty">点击句中任意单词，查看它的词性与作用</div></div>';
    html += '</div>';

    // structure
    if (data.f) {
      html += `<div class="sp-formula">${escapeHtml(data.f)}</div>`;
    }

    if (clauses.length) {
      html += '<div class="sp-section-label">句子结构 · Clause Breakdown</div>';
      html += '<div class="sp-clauses">';
      clauses.forEach(c => {
        const s = Math.max(0, c.s || 0);
        const en = Math.min(words.length - 1, c.en != null ? c.en : s);
        const clauseText = words.slice(s, en + 1).map(w => w.t).join(' ');
        html += '<div class="sp-clause">';
        html += `<div class="sp-clause-tag${c.sub ? ' sub' : ''}">${escapeHtml(c.tag || '')}</div>`;
        html += '<div>';
        html += `<div class="sp-clause-text">${escapeHtml(clauseText)}</div>`;
        html += `<div class="sp-clause-note">${escapeHtml(c.n || '')}</div>`;
        html += '</div></div>';
      });
      html += '</div>';
    }

    if (data.sum) {
      html += `<div class="sp-summary">${escapeHtml(data.sum)}</div>`;
    }

    $result.innerHTML = html;

    // wire up word clicks
    const $sentence = document.getElementById('sp-sentence');
    const $detail = document.getElementById('sp-detail');
    $sentence.querySelectorAll('.sp-word').forEach(el => {
      el.addEventListener('click', () => {
        $sentence.querySelectorAll('.sp-word').forEach(w => w.classList.remove('active'));
        el.classList.add('active');
        const i = +el.dataset.i;
        const w = words[i];
        const meta = posMeta[w.p] || posMeta.other;

        $detail.innerHTML =
          `<div class="sp-detail-word" style="color:${meta.color}">${escapeHtml(w.t)} · ${meta.zh}</div>` +
          `<div class="sp-detail-text">${escapeHtml(w.e || '')}</div>` +
          '<div class="sp-dict-section" id="sp-dict-section"></div>';

        if (w.p !== 'other') {
          loadDictionaryEntry(w.t);
        }
      });
    });
  }

  // 词典策略：
  // - 中文词：本地 CC-CEDICT（cedict.json，随页面一起部署，不联网查询，需要你把文件放在同目录）
  // - 英文词：免费 Free Dictionary API（数据主要来自 Wiktionary）+ 可选的 Merriam-Webster（更权威，需要你自己申请 Key）
  // 牛津 / 柯林斯的数据是付费授权的，个人小工具拿不到，所以没有接入。
  const dictCache = {};
  const CJK_RE = /[\u4e00-\u9fff]/;
  let cedictData = null, cedictLoading = null;

  function loadCedict() {
    if (cedictData) return Promise.resolve(cedictData);
    if (cedictLoading) return cedictLoading;
    cedictLoading = fetch('./cedict.json')
      .then(res => { if (!res.ok) throw new Error('cedict.json 未找到'); return res.json(); })
      .then(data => { cedictData = data; return data; })
      .catch(err => { cedictData = false; throw err; });
    return cedictLoading;
  }

  async function loadDictionaryEntry(word) {
    const $section = document.getElementById('sp-dict-section');
    if (!$section) return;

    if (CJK_RE.test(word)) {
      $section.innerHTML = '<div class="sp-dict-loading">加载本地词典中…</div>';
      try {
        const dict = await loadCedict();
        renderCedictSection($section, dict, word);
      } catch (err) {
        $section.innerHTML =
          '<div class="sp-dict-empty">没找到 cedict.json——把它和这个网页放在同一个文件夹里就能用本地中文词典了</div>' +
          `<button class="sp-web-btn" id="sp-web-btn">查网络 / 口语释义</button><div id="sp-web-note"></div>`;
        document.getElementById('sp-web-btn').onclick = () => loadWebUsage(word);
      }
      return;
    }

    const key = word.toLowerCase().replace(/[^a-z'-]/g, '');
    if (!key) { $section.innerHTML = ''; return; }

    $section.innerHTML = '<div class="sp-dict-loading">词典查询中…</div>';

    if (dictCache[key]) {
      renderDictSection($section, dictCache[key], word);
      return;
    }

    try {
      const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(key));
      if (!res.ok) throw new Error('not found');
      const data = await res.json();
      dictCache[key] = data;
      renderDictSection($section, data, word);
    } catch (e) {
      dictCache[key] = null;
      renderDictSection($section, null, word);
    }
  }

  function renderCedictSection($section, dict, word) {
    let html = '<div class="sp-dict-source">本地词典 · CC-CEDICT</div>';
    let entries = (dict.words && dict.words[word]) || null;
    if (!entries) {
      const simp = dict.trad && dict.trad[word];
      if (simp) entries = dict.words[simp];
    }

    if (entries && entries.length) {
      entries.slice(0, 4).forEach(e => {
        html += `<div class="sp-dict-pinyin">${escapeHtml(e.p || '')}${e.t ? ` · 繁体 ${escapeHtml(e.t)}` : ''}</div>`;
        (e.d || []).slice(0, 5).forEach(def => {
          html += `<div class="sp-dict-def">${escapeHtml(def)}</div>`;
        });
      });
    } else {
      html += '<div class="sp-dict-empty">CC-CEDICT 未收录（可能是专有名词或较新的词）</div>';
    }

    html += `<button class="sp-web-btn" id="sp-web-btn">查网络 / 口语释义</button><div id="sp-web-note"></div>`;
    $section.innerHTML = html;
    document.getElementById('sp-web-btn').onclick = () => loadWebUsage(word);
  }

  function renderDictSection($section, entries, word) {
    let html = '<div class="sp-dict-source">词典释义 · Free Dictionary API</div>';

    if (entries && entries.length) {
      const entry = entries[0];
      const phonetic = entry.phonetic || (entry.phonetics || []).map(p => p.text).find(Boolean);
      if (phonetic) html += `<div class="sp-dict-phonetic">${escapeHtml(phonetic)}</div>`;

      (entry.meanings || []).slice(0, 3).forEach(m => {
        html += `<div class="sp-dict-pos">${escapeHtml(m.partOfSpeech || '')}</div>`;
        (m.definitions || []).slice(0, 2).forEach(d => {
          html += `<div class="sp-dict-def">${escapeHtml(d.definition || '')}</div>`;
          if (d.example) html += `<div class="sp-dict-example">"${escapeHtml(d.example)}"</div>`;
        });
      });
    } else {
      html += '<div class="sp-dict-empty">词典未收录这个词形（可能是变形、缩写或专有名词）</div>';
    }

    html += `<button class="sp-web-btn" id="sp-web-btn">查网络 / 口语释义</button><div id="sp-web-note"></div>`;
    $section.innerHTML = html;

    document.getElementById('sp-web-btn').onclick = () => loadWebUsage(word);

    const mwKey = $mwKey.value.trim();
    if (mwKey) loadMerriamWebster($section, word, mwKey);
  }

  async function loadMerriamWebster($section, word, mwKey) {
    const holder = document.createElement('div');
    holder.className = 'sp-dict-loading';
    holder.textContent = 'Merriam-Webster 查询中…';
    holder.id = 'sp-mw-holder';
    $section.insertBefore(holder, $section.querySelector('.sp-web-btn'));

    try {
      const res = await fetch(
        'https://www.dictionaryapi.com/api/v3/references/collegiate/json/' +
        encodeURIComponent(word) + '?key=' + encodeURIComponent(mwKey)
      );
      const data = await res.json();
      const valid = Array.isArray(data) ? data.filter(x => x && typeof x === 'object' && x.shortdef) : [];

      let html = '<div class="sp-dict-source sub">Merriam-Webster</div>';
      if (valid.length) {
        valid.slice(0, 3).forEach(e => {
          html += `<div class="sp-dict-pos">${escapeHtml(e.fl || '')}</div>`;
          (e.shortdef || []).slice(0, 3).forEach(d => {
            html += `<div class="sp-dict-def">${escapeHtml(d)}</div>`;
          });
        });
      } else {
        html += '<div class="sp-dict-empty">Merriam-Webster 未收录，或 Key 无效</div>';
      }
      holder.outerHTML = html;
    } catch (err) {
      holder.outerHTML = '<div class="sp-dict-source sub">Merriam-Webster</div><div class="sp-dict-empty">查询失败</div>';
    }
  }

  async function loadWebUsage(word) {
    const $btnWeb = document.getElementById('sp-web-btn');
    const $note = document.getElementById('sp-web-note');
    const apiKey = GEMINI_API_KEY_HARDCODED || $key.value.trim();
    if (!apiKey) { $note.innerHTML = '<div class="sp-dict-empty">需要先填 Gemini Key</div>'; return; }

    $btnWeb.disabled = true;
    $note.innerHTML = '<div class="sp-dict-loading">查询中…</div>';

    const prompt =
      `The English word/phrase is: "${word}". ` +
      'Briefly explain, in Chinese, any notable informal, slang, internet, or pop-culture usage of this word that a standard dictionary might miss (e.g. meme usage, internet slang meaning, recent shifted usage). ' +
      'If there is genuinely no notable informal/internet usage beyond its standard dictionary meaning, say so plainly in Chinese instead of inventing one. Keep it to 1-2 short sentences.';

    try {
      const response = await fetch(
        'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=' + encodeURIComponent(apiKey),
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [ { role: 'user', parts: [ { text: prompt } ] } ],
            generationConfig: { maxOutputTokens: 400, thinkingConfig: { thinkingLevel: 'low' } }
          })
        }
      );
      const data = await response.json();
      if (data.error) throw new Error(data.error.message || 'API error');
      const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      const text = parts.map(p => p.text || '').join('').trim();
      $note.innerHTML = `<div class="sp-web-note">${escapeHtml(text || '（未获得结果，请重试）')}</div>`;
    } catch (err) {
      $note.innerHTML = `<div class="sp-dict-empty">查询失败：${escapeHtml(err.message || '请重试')}</div>`;
    } finally {
      $btnWeb.disabled = false;
    }
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
})();
</script>

</body>
</html>
